name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Validate plugin manifests
        run: |
          python -c "import json; json.load(open('plugin.json', encoding='utf-8')); json.load(open('.codex-plugin/plugin.json', encoding='utf-8')); json.load(open('mcp.json', encoding='utf-8')); print('plugin manifests OK')"

      - name: Validate version consistency
        run: |
          python -c "
          import json, re, pathlib
          plugin = json.load(open('plugin.json', encoding='utf-8'))['version']
          codex = json.load(open('.codex-plugin/plugin.json', encoding='utf-8'))['version']
          server = re.search(r'SERVER_VERSION\s*=\s*\"([^\"]+)\"', pathlib.Path('server/src_guarded_mcp.py').read_text(encoding='utf-8')).group(1)
          assert plugin == codex == server, f'Version mismatch: plugin={plugin}, codex-plugin={codex}, server={server}'
          print('Version consistency OK:', plugin)
          "

      - name: Build release artifacts
        shell: pwsh
        run: ./scripts/build_release.ps1 -SkipTests
